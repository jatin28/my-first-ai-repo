services:
  - type: web
    name: my-first-ai-agent
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
